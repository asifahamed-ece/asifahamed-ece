name: Generate Contribution Snake

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution grid snake
        id: snake
        uses: Platane/snk@v3
        with:
          github_user_name: asifahamed-ece
          outputs: |
            output/github-contribution-grid-snake.svg

      - name: Add eaten-dots counter
        run: python3 tools/add_snake_counter.py output/github-contribution-grid-snake.svg

      - name: Commit and push snake
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add output/github-contribution-grid-snake.svg
          git diff --staged --quiet || git commit -m "Update contribution snake [skip ci]"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/asifahamed-ece/asifahamed-dev.git main