name: Generate Contribution Snake

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:  # Allow manual trigger

# Least privilege: this job only commits the regenerated SVG back to this
# repo. Without this block the job inherits the default token permissions,
# which have historically been broader than needed.
permissions:
  contents: write

concurrency:
  group: snake-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution grid snake
        id: snake
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: asifahamed-ece
          outputs: |
            output/github-contribution-grid-snake.svg

      - name: Enhance snake SVG (rigid growing body + instant eat + slower loop)
        run: python3 tools/snake_growth_enhancer.py output/github-contribution-grid-snake.svg output/github-contribution-grid-snake-enhanced.svg 1.5
      - name: Add eaten-dots counter
        run: python3 tools/add_snake_counter.py output/github-contribution-grid-snake-enhanced.svg
      - name: Validate Pac-Man-style eating/snake-growth animation
        run: python3 tools/snake_validator.py output/github-contribution-grid-snake-enhanced.svg

      - name: Commit and push snake
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add output/github-contribution-grid-snake-enhanced.svg
          git diff --staged --quiet || git commit -m "Update contribution snake [skip ci]"
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
