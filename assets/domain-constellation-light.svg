      <text x="0" y="16" font-size="14" fill="#57606A">connect the constrained world</text>
      <text x="0" y="42" font-size="14" letter-spacing="0.6" fill="#57606A">HUB: LOW-LEVEL -&gt; REAL-TIME</text>
    </g>
    <!-- Port dots sit on the six face midpoints, i.e. exactly where each trace starts. -->
    <g>
      <circle cx="0" cy="-129.904" r="3.6"><animate attributeName="r" values="3.6;3.6;5.2;3.6" keyTimes="0;0.28;0.38;1" dur="4.8s" repeatCount="indefinite"/></circle>
      <circle cx="112.5" cy="-64.952" r="3.6"><animate attributeName="r" values="3.6;3.6;5.2;3.6" keyTimes="0;0.28;0.38;1" dur="4.8s" repeatCount="indefinite"/></circle>
      <circle cx="112.5" cy="64.952" r="3.6"><animate attributeName="r" values="3.6;3.6;5.2;3.6" keyTimes="0;0.28;0.38;1" dur="4.8s" repeatCount="indefinite"/></circle>
      <circle cx="0" cy="129.904" r="3.6"><animate attributeName="r" values="3.6;3.6;5.2;3.6" keyTimes="0;0.28;0.38;1" dur="4.8s" repeatCount="indefinite"/></circle>
      <circle cx="-112.5" cy="64.952" r="3.6"><animate attributeName="r" values="3.6;3.6;5.2;3.6" keyTimes="0;0.28;0.38;1" dur="4.8s" repeatCount="indefinite"/></circle>
