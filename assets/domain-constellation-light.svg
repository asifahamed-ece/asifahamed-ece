    <g>
      <circle cx="0" cy="-180.103" r="4" fill="#8A5A00"/><circle cx="0" cy="-205.202" r="4" fill="#8A5A00"/><circle cx="0" cy="-230.301" r="4" fill="#8A5A00"/>
      <circle cx="147.457" cy="-85.135" r="4" fill="#0E6E8C"/><circle cx="164.936" cy="-95.226" r="4" fill="#0E6E8C"/><circle cx="182.415" cy="-105.317" r="4" fill="#0E6E8C"/>
      <circle cx="147.457" cy="85.135" r="4" fill="#6D3BC7"/><circle cx="164.936" cy="95.226" r="4" fill="#6D3BC7"/><circle cx="182.415" cy="105.317" r="4" fill="#6D3BC7"/>
      <circle cx="0" cy="180.103" r="4" fill="#B31B8C"/><circle cx="0" cy="205.202" r="4" fill="#B31B8C"/><circle cx="0" cy="230.301" r="4" fill="#B31B8C"/>
      <circle cx="-147.457" cy="85.135" r="4" fill="#B23A0C"/><circle cx="-164.936" cy="95.226" r="4" fill="#B23A0C"/><circle cx="-182.415" cy="105.317" r="4" fill="#B23A0C"/>
      <circle cx="-147.457" cy="-85.135" r="4" fill="#2C5FD0"/><circle cx="-164.936" cy="-95.226" r="4" fill="#2C5FD0"/><circle cx="-182.415" cy="-105.317" r="4" fill="#2C5FD0"/>
    </g>

    <!-- 18 travelling packets: three per trace, staggered by exactly dur/3 of the 1.6s trip
         (begins 0s / -0.533333s / -1.066667s = 0 / -dur/3 / -2*dur/3), so the three sit an even
         third of the trace apart and the stream never gaps or bunches. 3 x 1.6s = 4.8s, which
         is also the master loop, so the whole diagram repeats seamlessly.
         NOTE: the begins must be dur/3 steps, NOT whole multiples of dur. begin="-1.6s" and
         begin="-3.2s" are exact multiples of dur, so all three packets resolve to phase 0 and
         travel as one clump instead of a stream.
         Each circle sits on its trace's hub-end start point and the motion path is the
         relative offset to that card's edge, so all 18 land exactly on current card edges. -->
    <g>
      <circle cx="0" cy="-129.904" r="5.5" fill="#8A5A00"><animateMotion path="M0 0 L0 -150.596" dur="1.6s" begin="0s" keyPoints="0;1" keyTimes="0;1" calcMode="linear" repeatCount="indefinite"/></circle>
      <circle cx="0" cy="-129.904" r="5.5" fill="#8A5A00"><animateMotion path="M0 0 L0 -150.596" dur="1.6s" begin="-0.533333s" keyPoints="0;1" keyTimes="0;1" calcMode="linear" repeatCount="indefinite"/></circle>
      <circle cx="0" cy="-129.904" r="5.5" fill="#8A5A00"><animateMotion path="M0 0 L0 -150.596" dur="1.6s" begin="-1.066667s" keyPoints="0;1" keyTimes="0;1" calcMode="linear" repeatCount="indefinite"/></circle>

      <circle cx="112.5" cy="-64.952" r="5.5" fill="#0E6E8C"><animateMotion path="M0 0 L104.872 -60.548" dur="1.6s" begin="0s" keyPoints="0;1" keyTimes="0;1" calcMode="linear" repeatCount="indefinite"/></circle>
      <circle cx="112.5" cy="-64.952" r="5.5" fill="#0E6E8C"><animateMotion path="M0 0 L104.872 -60.548" dur="1.6s" begin="-0.533333s" keyPoints="0;1" keyTimes="0;1" calcMode="linear" repeatCount="indefinite"/></circle>
      <circle cx="112.5" cy="-64.952" r="5.5" fill="#0E6E8C"><animateMotion path="M0 0 L104.872 -60.548" dur="1.6s" begin="-1.066667s" keyPoints="0;1" keyTimes="0;1" calcMode="linear" repeatCount="indefinite"/></circle>

      <circle cx="112.5" cy="64.952" r="5.5" fill="#6D3BC7"><animateMotion path="M0 0 L104.872 60.548" dur="1.6s" begin="0s" keyPoints="0;1" keyTimes="0;1" calcMode="linear" repeatCount="indefinite"/></circle>
      <circle cx="112.5" cy="64.952" r="5.5" fill="#6D3BC7"><animateMotion path="M0 0 L104.872 60.548" dur="1.6s" begin="-0.533333s" keyPoints="0;1" keyTimes="0;1" calcMode="linear" repeatCount="indefinite"/></circle>
      <circle cx="112.5" cy="64.952" r="5.5" fill="#6D3BC7"><animateMotion path="M0 0 L104.872 60.548" dur="1.6s" begin="-1.066667s" keyPoints="0;1" keyTimes="0;1" calcMode="linear" repeatCount="indefinite"/></circle>

      <circle cx="0" cy="129.904" r="5.5" fill="#B31B8C"><animateMotion path="M0 0 L0 150.596" dur="1.6s" begin="0s" keyPoints="0;1" keyTimes="0;1" calcMode="linear" repeatCount="indefinite"/></circle>
      <circle cx="0" cy="129.904" r="5.5" fill="#B31B8C"><animateMotion path="M0 0 L0 150.596" dur="1.6s" begin="-0.533333s" keyPoints="0;1" keyTimes="0;1" calcMode="linear" repeatCount="indefinite"/></circle>
