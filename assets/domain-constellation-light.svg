        <animate attributeName="stroke-opacity" values="1;1;0.78;1" keyTimes="0;0.28;0.38;1" dur="4.8s" repeatCount="indefinite"/>
      </polygon>
    </g>
    <g text-anchor="middle">
      <text x="0" y="-48" font-size="14" letter-spacing="1.6" fill="#57606A">ASIF // EMBEDDED</text>
