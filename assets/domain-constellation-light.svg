      <circle cx="-112.5" cy="64.952" r="5.5" fill="#B23A0C"><animateMotion path="M0 0 L-104.872 60.548" dur="1.6s" begin="-1.066667s" keyPoints="0;1" keyTimes="0;1" calcMode="linear" repeatCount="indefinite"/></circle>

