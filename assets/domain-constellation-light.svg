      <text x="-80.8" y="15.5" font-size="14" fill="#57606A">on-device inference</text>
    </g>

    <!-- Wireless  (-150, radius 310) -->
    <g transform="translate(-268.468 -155)">
      <rect x="-110" y="-29.5" width="220" height="59" rx="9" fill="#F6F8FA" stroke="#0A7D3C" stroke-width="2" stroke-opacity="1">
        <animate attributeName="stroke-opacity" values="1;1;0.72;1" keyTimes="0;0.865;0.965;1" dur="4.8s" repeatCount="indefinite"/>
      </rect>
      <circle cx="-94" cy="-11.5" r="5.2" fill="#FFFFFF" stroke="#0A7D3C" stroke-width="2.4">
