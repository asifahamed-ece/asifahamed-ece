<?xml version="1.0" encoding="UTF-8"?>
<!-- Light-mode twin of domain-constellation.svg, generated by
     tools/derive_light_constellation.py. Do not edit by hand.
     Same geometry and SMIL motion; hues darkened to clear WCAG AA on white. -->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="722" viewBox="0 0 800 722" role="img" aria-labelledby="title desc">
  <title id="title">Embedded engineering domain constellation</title>
  <desc id="desc">A hexagonal star network map. A central Asif embedded-systems hub, drawn as a green hexagon and the largest element on the canvas, is the centre of the constellation. Six green domain cards sit at the six points of an even pointy-top hexagon, all at one uniform radius, so the layout reads as a star rather than a row: Bare-Metal C at the top, ESP32 and ESP-IDF at the upper right, FreeRTOS at the lower right, Systems and Linux at the bottom, Edge AI at the lower left, and Wireless at the upper left. Each card is joined to the hub by one short straight colour-coded signal trace, and three packets of that colour stream continuously outward from the hub to the card while the card borders, the status dots and the hub outline each breathe slowly in a staggered ripple, well under the two-hertz flash ceiling.</desc>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#D0D7DE" stroke-width="1" opacity="1"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="800" height="722" fill="#FFFFFF"/>
  <rect x="0" y="0" width="800" height="722" fill="url(#grid)"/>

  <!-- Hub origin. Six cards at angles -90/-150/-30/30/90/150, one uniform radius 310,
       i.e. a true pointy-top hexagon. Card centres:
         Bare-Metal C  (0, -310)      ESP32  (268.468, -155)
         Wireless      (-268.468, -155) FreeRTOS (268.468, 155)
         Edge AI       (-268.468, 155) Systems (0, 310)
       The hub is a flat-top hexagon of circumradius 150, so all six spoke directions
       (-90/-150/-30/30/90/150) leave it through the midpoint of a face, at the apothem
       129.904, so every trace starts at exactly the same distance from the centre. -->
  <g transform="translate(400 361)" fill="#0A7D3C" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">

    <!-- Six colour-coded spokes, hub face -> card edge. Decorative geometry is dimmer than text. -->
    <g fill="none" stroke-width="2.6" stroke-linecap="round" opacity="0.9" stroke-dasharray="3.5 11">
      <path d="M0 -129.904L0 -280.5" stroke="#8A5A00"/>
      <path d="M112.5 -64.952L217.372 -125.5" stroke="#0E6E8C"/>
      <path d="M112.5 64.952L217.372 125.5" stroke="#6D3BC7"/>
      <path d="M0 129.904L0 280.5" stroke="#B31B8C"/>
      <path d="M-112.5 64.952L-217.372 125.5" stroke="#B23A0C"/>
      <path d="M-112.5 -64.952L-217.372 -125.5" stroke="#2C5FD0"/>
    </g>

    <!-- Bare-Metal C  (-90, radius 310) -->
    <g transform="translate(0 -310)">
      <rect x="-110" y="-29.5" width="220" height="59" rx="9" fill="#F6F8FA" stroke="#0A7D3C" stroke-width="2" stroke-opacity="1">
        <animate attributeName="stroke-opacity" values="1;1;0.72;1" keyTimes="0;0.04;0.14;1" dur="4.8s" repeatCount="indefinite"/>
      </rect>
      <circle cx="-94" cy="-11.5" r="5.2" fill="#FFFFFF" stroke="#0A7D3C" stroke-width="2.4">
        <animate attributeName="r" values="5.2;5.2;7.2;5.2" keyTimes="0;0.04;0.14;1" dur="4.8s" repeatCount="indefinite"/>
      </circle>
      <text x="-80.8" y="-4.5" font-size="20" font-weight="700" opacity="1">Bare-Metal C</text>
      <text x="-80.8" y="15.5" font-size="14" fill="#57606A">STM32 / no HAL</text>
    </g>

    <!-- ESP32 / ESP-IDF  (-30, radius 310) -->
    <g transform="translate(268.468 -155)">
