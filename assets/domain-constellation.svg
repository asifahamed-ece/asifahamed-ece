<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-authored profile README asset: embedded-domain constellation with restrained SMIL motion. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="868" height="515" viewBox="16 5 868 515" role="img" aria-labelledby="title desc">
  <title id="title">Embedded engineering domain constellation</title>
  <desc id="desc">A Matrix-style system map showing Asif's embedded systems hub connected to six grounded domains. Data packets travel outward along the traces while the domain indicators and hub breathe slowly.</desc>

  <defs>
