<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 780 250" width="780" height="250" style="background-color: #00000000;">
  <!-- Light-mode twin of about-glow.svg, selected by a <picture> element in the README.
       The dark version is unreadable on a white page: .accent was literally #FFFFFF
       (1.00:1) and .dim was #4dffb5 at opacity 0.65 (about 1.17:1), so every body
       line vanished. Here the hues are darkened to clear 4.5:1 and the glow filter
       is gone, because a neon halo on white smears into the page and eats the glyphs. -->
  <style>
    .t {
      font-family: 'Fira Code', Consolas, 'Courier New', monospace;
      font-size: 19px;
      fill: #0A7D3C;
    }
    .dim { fill: #57606A; }
    .accent { fill: #1F2328; font-weight: 700; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }
  </style>

  <!-- cursor blink (terminal vibe) -->
  <rect x="740" y="18" width="12" height="22" rx="2" fill="#0A7D3C" class="pulse" />

  <!-- prompt line -->
  <text x="20" y="38" class="t dim">$</text>
  <text x="44" y="38" class="t">./about.sh --human</text>

  <line x1="20" y1="55" x2="760" y2="55" stroke="#D0D7DE" stroke-width="1" />

  <!-- About Me lines -->
  <text x="24" y="84" class="t"><tspan class="accent">&gt;</tspan> <tspan class="dim">Location :</tspan> Tamil Nadu, India</text>
  <text x="24" y="112" class="t"><tspan class="accent">&gt;</tspan> <tspan class="dim">Education:</tspan> B.E. ECE @ Rajalakshmi Engineering College</text>
  <text x="24" y="140" class="t"><tspan class="accent">&gt;</tspan> <tspan class="dim">Focus    :</tspan> Bare-metal firmware | Device drivers | FreeRTOS</text>
  <text x="24" y="168" class="t"><tspan class="accent">&gt;</tspan> <tspan class="dim">Wireless :</tspan> ESP-NOW | LoRa | BLE | WiFi</text>
  <text x="24" y="196" class="t"><tspan class="accent">&gt;</tspan> <tspan class="dim">Status   :</tspan> Building low-power embedded systems</text>
  <text x="24" y="226" class="t"><tspan class="accent">&gt;</tspan> <tspan class="dim">Motto    :</tspan> "Debugging is just aggressive learning."</text>
</svg>
