<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 224 54" width="224" height="54" style="background-color: #00000000;">
  <style>
    .prompt { font-family: 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; font-size: 18px; fill: #57606A; stroke: #D42BB0; stroke-width: 0.9px; paint-order: stroke fill; }
    .cmd    { font-family: 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; font-size: 18px; fill: #B31B8C; font-weight: 700; stroke: #D42BB0; stroke-width: 1.2px; paint-order: stroke fill; }
    .cursor { animation: blink 1.1s steps(2) infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>

  <text x="24" y="32" class="prompt">$</text>
  <text x="50" y="32" class="cmd">ls ./projects/</text>
  <rect x="215" y="16" width="14" height="22" rx="2" fill="#B31B8C" class="cursor" />
</svg>
